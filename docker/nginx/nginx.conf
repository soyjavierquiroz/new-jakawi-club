user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $request_uri $jakawi_referrer_policy {
        ~^/auth/jakawi(/callback)?([?]|$) no-referrer;
        default strict-origin-when-cross-origin;
    }
    map $request_uri $jakawi_log_path {
        ~^/activar/ /activar/[redacted];
        ~^/restablecer-password/ /restablecer-password/[redacted];
        default $uri;
    }
    # Short commercial redirects do not retain visitor IPs or access records.
    # Existing 12-character registration invitations retain their current behavior.
    map $request_uri $jakawi_access_loggable {
        "~^/r/(?![A-Z0-9]{12}(?:[?]|$))" 0;
        default 1;
    }
    log_format main '$remote_addr [$time_local] "$request_method $jakawi_log_path $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main if=$jakawi_access_loggable;
    sendfile on;
    keepalive_timeout 20;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
