user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $uri $jakawi_referrer_policy {
        /auth/jakawi no-referrer;
        /auth/jakawi/callback no-referrer;
        default strict-origin-when-cross-origin;
    }
    map $request_uri $jakawi_log_path {
        ~^/activar/ /activar/[redacted];
        ~^/restablecer-password/ /restablecer-password/[redacted];
        default $uri;
    }
    log_format main '$remote_addr [$time_local] "$request_method $jakawi_log_path $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 20;
    server_tokens off;
    include /etc/nginx/conf.d/*.conf;
}
