name: jakawi-club

x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"

services:
  app:
    image: jakawi-club-php:8.4-base-v1
    pull_policy: never
    container_name: jakawi-club-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - /srv/sites/jakawi.club/secrets/app.env
      - /srv/sites/jakawi.club/secrets/com-identity.env
      - /srv/sites/jakawi.club/secrets/com-oidc.env
      - /srv/sites/jakawi.club/secrets/com-purchases.env
      - /srv/sites/jakawi.club/secrets/media.env
      - /srv/sites/jakawi.club/secrets/imgproxy.env
    volumes:
      - ./app:/var/www/html:ro
      - ./docs/landings:/var/www/docs/landings:ro
      - /srv/sites/jakawi.club/storage:/var/www/html/storage
      - /srv/sites/jakawi.club/bootstrap-cache:/var/www/html/bootstrap/cache
      - /srv/sites/jakawi.club/secrets/crm-hmac:/run/secrets/crm_club_hmac:ro
      - /srv/sites/jakawi.club/secrets/com-commercial-hmac:/run/secrets/com_commercial_hmac:ro
    networks:
      - private
      - egress
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 320m
    cpus: 0.65
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD-SHELL, "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_URI=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  web:
    image: nginx:stable-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: jakawi-club-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/public:/var/www/html/public:ro
      - /srv/sites/jakawi.club/storage/app/public:/var/www/html/public/storage:ro
      - /srv/sites/jakawi.club/nginx-logs:/var/log/nginx
    networks:
      - private
      - egress
      - traefik
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 48m
    mem_reservation: 8m
    memswap_limit: 64m
    cpus: 0.20
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging

  db:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    container_name: jakawi-club-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jakawi_club
      POSTGRES_USER: jakawi_club_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - db_admin_password
      - db_app_password
    volumes:
      - /srv/sites/jakawi.club/postgres:/var/lib/postgresql/data
      - ./docker/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    networks:
      - private
    mem_limit: 192m
    mem_reservation: 64m
    memswap_limit: 256m
    cpus: 0.40
    pids_limit: 80
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U jakawi_club_admin -d jakawi_club"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

networks:
  private:
    name: jakawi-club-private
    internal: true
  egress:
    name: jakawi-club-egress
    external: true
  traefik:
    name: web
    external: true

secrets:
  db_admin_password:
    file: /srv/sites/jakawi.club/secrets/db-admin-password
  db_app_password:
    file: /srv/sites/jakawi.club/secrets/db-app-password
